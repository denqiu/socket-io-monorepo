<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Fieldset Form Demo</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
        form { max-width: 500px; margin: 0 auto; }
        fieldset { margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; }
        legend { font-weight: bold; }
        label { display: inline-block; margin-right: 10px; }
        button { display: block; margin: 20px auto; padding: 10px 20px; }
        #result { margin-top: 20px; padding: 10px; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Multi-Fieldset Form Demo</h1>

    <form id="multiFieldsetForm">
        <fieldset>
            <legend>Favorite Color</legend>
            <input type="radio" id="red" name="color" value="red">
            <label for="red">Red</label>
            <input type="radio" id="blue" name="color" value="blue">
            <label for="blue">Blue</label>
            <input type="radio" id="green" name="color" value="green">
            <label for="green">Green</label>
        </fieldset>

        <fieldset>
            <legend>Preferred Contact Method</legend>
            <input type="radio" id="email" name="contact" value="email">
            <label for="email">Email</label>
            <input type="radio" id="phone" name="contact" value="phone">
            <label for="phone">Phone</label>
            <input type="radio" id="mail" name="contact" value="mail">
            <label for="mail">Mail</label>
        </fieldset>

        <button type="submit">Submit</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('multiFieldsetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            let selectedValues = {};
            
            for (let [name, value] of formData.entries()) {
                selectedValues[name] = value;
            }
            
            const resultDiv = document.getElementById('result');
            
            if (Object.keys(selectedValues).length === 2) {
                let resultHTML = '<h3>Form Submitted Successfully</h3>';
                for (let [name, value] of Object.entries(selectedValues)) {
                    resultHTML += `<p><strong>${name}:</strong> ${value}</p>`;
                }
                resultDiv.innerHTML = resultHTML;
                console.log('Form submitted with selections:', selectedValues);
            } else {
                resultDiv.innerHTML = '<h3>Please make a selection in each fieldset</h3>';
                console.log('Please make a selection in each fieldset');
            }
        });
    </script>
</body>
</html>
